name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck / lint / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Vercel builds on push; build here too so a broken build fails the PR.
      - run: npm run build

  ml-lint:
    name: ML pipeline + scripts (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Lint only: ruff parses the files without importing them, so no torch /
      # sklearn install. Rules live in the root ruff.toml (F + E9, same as the
      # backend); ml/legacy and scripts/legacy are excluded there.
      - run: pip install ruff
      - run: ruff check ml scripts

  ml:
    name: ML pipeline unit tests (synthetic, no torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # spatial CV, segment evaluation, retrain verdict, model-card builder,
      # frame quality, pairwise pilot: numpy/pandas/scipy/sklearn (+ OpenCV
      # headless for frame_quality). No torch, no images, no DB.
      - run: >
          pip install pytest numpy pandas scipy scikit-learn joblib
          opencv-python-headless
      - run: python -m pytest -q ml/tests

  backend:
    name: Backend (ruff / pytest + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # Minimal deps for the isolated tests (no DB connection / no torch —
      # `pip install -e .` would drag in torch via ultralytics). The auth and
      # permission tests import the real FastAPI app pieces and GraphQL
      # schema, so the web/DB layer packages are required; psycopg2 is only
      # loaded as a dialect, no server is contacted. sqlalchemy<2.1: 2.1 maps
      # `postgresql://` to psycopg v3 (see backend/requirements.txt). numpy +
      # pillow: the hi-res view tests skip without them; torch stays out (the
      # DINO tests skip).
      - run: >
          pip install pytest pytest-cov ruff pydantic pydantic-settings httpx
          fastapi "sqlalchemy<2.1" geoalchemy2 psycopg2-binary
          strawberry-graphql sse-starlette alembic "PyJWT[crypto]"
          requests googlemaps numpy pillow pyright==1.1.389
      # Rules live in backend/pyproject.toml ([tool.ruff.lint]: F + E9).
      - run: ruff check .
      # Static types (pyright basic) on app/: fails on NEW errors only; the
      # existing ones are counted in pyright_baseline.json (DEVELOPMENT.md).
      - run: python scripts/check_types.py
      # Floor a few points under today's 64% (T-18): catches a big untested drop.
      - run: pytest --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=60
