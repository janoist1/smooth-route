directive @isAdmin on FIELD_DEFINITION

type AdminStats {
  totalImages: Int!
  imagesThisMonth: Int!
  freeTierLimit: Int!
  billableThisMonth: Int!
  imagesPerDay: [DailyCount!]!
  totalPoints: Int!
  analyzedPoints: Int!
  pendingAnalysis: Int!
  rqiGood: Int!
  rqiFair: Int!
  rqiPoor: Int!
  rqiUnknown: Int!
  rqiUnusable: Int!
  totalUsers: Int!
  adminUsers: Int!
  recentJobs: [JobSummary!]!
}

type Annotation {
  id: String!
  label: String!
  score: Float!
  type: String!
  points: JSON!
}

type AreaCount {
  area: String!
  count: Int!
}

type DailyCount {
  day: String!
  count: Int!
}

"""Date with time (isoformat)"""
scalar DateTime

input DetectInput {
  filename: String!
  confThreshold: Float = null
  classes: [String!] = null
}

type DetectPrediction {
  label: String!
  confidence: Float!
  points: JSON!
}

enum FilterMode {
  ALL
  PENDING
  REVIEWED
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf).
"""
scalar JSON @specifiedBy(url: "https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf")

type Job {
  id: String!
  status: String!
  progress: Int!
  total: Int!
  message: String!
  type: String!
  currentStep: String
  details: JSON
  result: JSON
  error: String
  createdAt: DateTime!
  completedAt: DateTime
}

type JobSummary {
  id: String!
  status: String!
  message: String
  progress: Int!
  total: Int!
  createdAt: DateTime
  completedAt: DateTime
}

type LabelExample {
  rqi: Int!
  id: Int!
  imageUrl: String!
}

type LabelPair {
  a: LabelQueueItem!
  b: LabelQueueItem!
  scoreGap: Float!
}

type LabelQueueItem {
  id: Int!
  imageUrl: String!
  latitude: Float!
  longitude: Float!
  heading: Float
  captureDate: String
  streetViewUrl: String!
  reason: String!
  area: String!
  uncertainty: Float
  cellLabels: Int!
  boundary: String
  modelScore: Float
  modelRqi: Int
  modelPBad: Float
}

type LabelQueueResult {
  strategy: LabelQueueStrategy!
  items: [LabelQueueItem!]!
  stats: LabelQueueStats!
}

type LabelQueueStats {
  totalLabelled: Int!
  labelledToday: Int!
  eligible: Int!
  scored: Int!
  rechecked: Int!
  recheckSame: Float
  recheckWithinOne: Float
  sprintLabelled: Int!
  sprintTarget: Int!
}

enum LabelQueueStrategy {
  UNCERTAIN
  DIVERSE
  MIXED
  RECHECK
  SPRINT
  WEAK_SPOTS
}

type LevelCount {
  level: Int!
  count: Int!
}

type ModelAdmin {
  trainedOn: Int!
  newLabels: Int!
  newByArea: [AreaCount!]!
  newByLevel: [LevelCount!]!
  sprintLabelled: Int!
  sprintTarget: Int!
  hint: String!
  candidateAvailable: Boolean!
  report: [String!]!
  reportVerdict: Boolean
  reportGatePass: Boolean
  reportAt: String
  confirmPhrase: String!
}

type Mutation {
  updateSetting(input: UpdateSettingInput!): Setting!
  applyPreset(values: JSON!): [Setting!]!
  runAnalysis(input: RunAnalysisInput!): Job!
  startModelTraining: Job!
  processRoute(input: ProcessRouteInput!): Job!
  saveTrainingData(input: TrainingDataInput!): String!
  deleteTrainingData(imageFilename: String!): Boolean!
  stopJob(jobId: String!): Boolean!
  detectObjects(input: DetectInput!): [DetectPrediction!]!
  performReviewAction(input: ReviewActionInput!): ReviewActionResult!
  predictDinoRqi(imageFilename: String!): Int
  quickLabel(input: QuickLabelInput!): QuickLabelResult!
  submitPairJudgment(input: PairJudgmentInput!): Boolean!
  undoPairJudgment(clientId: String!): Boolean!
  undoQuickLabel(pointId: Int!): Boolean!
  startRetrain: String!
  promoteCandidate(confirm: String!): String!
  startRescoreAndRebuild: String!
}

input PairJudgmentInput {
  clientId: String!
  frameAId: Int!
  frameBId: Int!
  result: PairResult!
  elapsedMs: Int = null
}

type PairQueueResult {
  pairs: [LabelPair!]!
  judged: Int!
}

enum PairResult {
  A
  B
  EQUAL
}

type Point {
  id: Int!
  latitude: Float!
  longitude: Float!
  heading: Float!
  pitch: Float
  imageUrl: String
  rqiScore: Float
  damageCount: Int!
  damageTypes: JSON
  analysisMetadata: JSON
  dinoRqiScore: Float
  createdAt: DateTime!
  rqiSource: String!
  panoId: String
  manualRqi: Float @isAdmin
  manualTags: [String!] @isAdmin
  manualAnnotations: JSON @isAdmin
  manualComment: String @isAdmin
  streetViewUrl: String!
  segmentId: ID
  captureDate: String
  localImagePath: String
  dinoPBad: Float
  dinoScore: Float
}

input ProcessRouteInput {
  origin: String!
  destination: String!
  path: [[Float!]!] = null
}

type PublicJob {
  id: String!
  status: String!
  progress: Int!
  total: Int!
  message: String!
  createdAt: DateTime!
  completedAt: DateTime
}

type Query {
  config: String!
  me: Viewer
  getRoute(origin: String!, destination: String!): RouteData
  settings: [Setting!]!
  availableModels: [String!]!
  rqiModelInfo: RqiModelInfo!
  point(id: Int!): Point
  points(bbox: [Float!] = null, limit: Int! = 100, offset: Int! = 0): [Point!]!
  roadQualityGrid(zoom: Int!, bbox: [Float!] = null): JSON!
  roadSegments(bbox: [Float!]!, zoom: Int!): [RoadSegment!]!
  routeQuality(path: [[Float!]!]!): RouteQuality!
  segmentFrames(segmentId: ID!): [Point!]!
  adminStats: AdminStats!
  trainingPoints(mode: FilterMode! = ALL, limit: Int! = 20, offset: Int! = 0, model: String! = "yolo"): TrainingPointsResponse!
  trainingStats(mode: FilterMode! = ALL, isDino: Boolean! = false): TrainingStats!
  job(id: String!): Job
  activeJob: Job
  nextTrainingPoint(currentId: Int!, mode: FilterMode! = ALL, model: String! = "yolo"): Int
  labelQueue(strategy: LabelQueueStrategy! = MIXED, limit: Int! = 20, excludeIds: [Int!] = null): LabelQueueResult!
  labelExamples(perClass: Int! = 1): [LabelExample!]!
  pairQueue(limit: Int! = 10, excludeIds: [Int!] = null): PairQueueResult!
  routeAlternatives(origin: String!, destination: String!): RouteAlternatives!
  modelAdmin: ModelAdmin!
}

input QuickLabelInput {
  pointId: Int!
  rqi: Int!
  strategy: String = null
  reason: String = null
  revealedModel: Boolean! = false
  elapsedMs: Int = null
}

type QuickLabelResult {
  pointId: Int!
  imageFilename: String!
  rqi: Int!
  totalLabelled: Int!
  labelledToday: Int!
}

input ReviewActionInput {
  actionType: String!
  parameters: JSON!
}

type ReviewActionResult {
  success: Boolean!
  message: String
  processedImageUrl: String
  annotations: [Annotation!]
}

type RoadSegment {
  id: ID!
  path: [[Float!]!]!
  rqi: Int
  score: Float
  pBad: Float
  confidence: Float!
  confidenceLevel: String!
  nImages: Int!
  lengthM: Float!
  roadName: String
  highway: String
  captureDateMin: String
  captureDateMax: String
  confidenceReason: String
  streetViewUrl: String
}

type RouteAlternatives {
  routes: [RouteOption!]!
  fastestIndex: Int
  smoothestIndex: Int
  maxExtraDuration: Float!
  minCoverage: Float!
}

type RouteData {
  points: [RouteStep!]!
}

type RouteOption {
  index: Int!
  points: [RouteStep!]!
  distanceM: Float!
  durationS: Float!
  summary: String!
  quality: RouteQuality!
  coverage: Float!
  isFastest: Boolean!
  isSmoothest: Boolean!
}

type RouteQuality {
  totalLengthM: Float!
  coveredLengthM: Float!
  lengthByRqi: [Float!]!
  meanScore: Float
  impactScore: Float
  worstSegments: [RoadSegment!]!
  meanRqi: Int
}

type RouteStep {
  lat: Float!
  lng: Float!
}

type RqiModelInfo {
  available: Boolean!
  version: Int
  backbone: String
  recipe: String
  head: String
  nTrain: Int
  qwk: Float
  mae: Float
  exactAcc: Float
  badRoadAcc: Float
  badRoadAuc: Float
  scaleMeaning: String
  metricsSource: String
  metricsProtocol: String
  metricsMeasuredOn: String
  segmentQwk: Float
  segmentLengthM: Float
  newAreaQwk: Float
}

input RunAnalysisInput {
  strategy: String!
  limit: Int! = 0
  reanalyze: Boolean! = false
}

type Setting {
  key: String!
  value: JSON!
  description: String
  example: String
  category: String
  explanation: String
}

input TrainingDataInput {
  imageFilename: String!
  manualRqi: Float = null
  annotations: JSON = null
  tags: [String!] = null
  manualComment: String = null
  metaData: JSON = null
}

type TrainingPointsResponse {
  items: [Point!]!
  totalCount: Int!
  hasMore: Boolean!
}

type TrainingStats {
  total: Int!
  pending: Int!
  annotated: Int!
  avgRqi: Float!
  goodCount: Int!
  fairCount: Int!
  poorCount: Int!
  rqi1Count: Int!
  rqi2Count: Int!
  rqi3Count: Int!
  rqi4Count: Int!
  rqi5Count: Int!
  pendingAnalysis: Int!
}

input UpdateSettingInput {
  key: String!
  value: JSON!
}

type Viewer {
  clerkId: String!
  email: String
  role: String!
}
